name: Build, Push, and Deploy to Cloud Run

on:
  push:
    branches:
      - capstonebranch-main # Only run on pushes to the 'main' branch

env:
  PROJECT_ID: ramiroh # Your GCP Project ID
  GCP_REGION: us-central1 # Region for Artifact Registry and Cloud Run
  SERVICE_NAME: capstone-service # Name of the Cloud Run service
  AR_REPO_NAME: github-artifacts # Name of your Artifact Registry repository
  SA_EMAIL: github-deploy-sa@ramiroh.iam.gserviceaccount.com # The Service Account email
  WIF_PROVIDER: projects/562675035234/locations/global/workloadIdentityPools/github-pool/providers/github-provider # Your full Workload Identity Provider ID

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' # This is required for Workload Identity Federation

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Authenticate to Google Cloud using WIF
      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SA_EMAIL }}

      # 2. Set up Docker and Configure gcloud for Artifact Registry
      - name: 'Set up Docker with gcloud'
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      # 3. Build and Push Docker Image
      - name: Build and Push Docker Image
        id: build-image
        run: |
          IMAGE_TAG="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          docker build -t ${IMAGE_TAG} .
          docker push ${IMAGE_TAG}
          echo "IMAGE_URL=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      # 4. Deploy to Cloud Run
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ steps.build-image.outputs.IMAGE_URL }}
          service_account_email: ${{ env.SA_EMAIL }}
          allow_unauthenticated: true

      - name: Show Deployment URL
        run: echo "Cloud Run URL: ${{ steps.deploy.outputs.url }}"
